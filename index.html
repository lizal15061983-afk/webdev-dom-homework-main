<!doctype html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <div class="container">
      <ul class="comments"></ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>
  </body>

  <script>
    // 1. Создаем переменные для элементов формы и всего списка комментариев (Шаг 6)
    const commentsList = document.querySelector(".comments");
    const nameInput = document.querySelector(".add-form-name");
    const textInput = document.querySelector(".add-form-text");
    const addFormButton = document.querySelector(".add-form-button");

    const comments = [
      {
        name: "Глеб Фокин",
        date: "12.02.22 12:18",
        text: "Это будет первый комментарий на этой странице",
        likes: 3,
        isLiked: false,
      },
      {
        name: "Варвара Н.",
        date: "13.02.22 19:22",
        text: "Мне нравится как оформлена эта страница! ❤",
        likes: 75,
        isLiked: true,
      },
    ];

    // Функция навешивания кликов на все кнопки лайков
    const initLikeButtons = () => {
      const likeButtons = document.querySelectorAll(".like-button");

      for (const likeButton of likeButtons) {
        likeButton.addEventListener("click", (event) => {
          event.stopPropagation(); //добаила -остановить всплытие клика
          const index = likeButton.dataset.index;
          const comment = comments[index];

          if (comment.isLiked) {
            comment.likes -= 1;
            comment.isLiked = false;
          } else {
            comment.likes += 1;
            comment.isLiked = true;
          }

          renderComments();
        });
      }
    };
    const initCommentReplies = () => {
      const commentElements = document.querySelectorAll(".comment");

      for (const commentElement of commentElements) {
        commentElement.addEventListener("click", () => {
          const index = commentElement.dataset.index;
          const comment = comments[index];

          textInput.value = `> ${comment.text}\n\n${comment.name}, `;
        });
      }
    };

    // Функция отрисовки списка комментариев из массива
    const renderComments = () => {
      const commentsHtml = comments
        .map((comment, index) => {
          return `
          <li class="comment" data-index="${index}">
            <div class="comment-header">
              <div>${comment.name}</div>
              <div>${comment.date}</div>
            </div>
            <div class="comment-body">
              <div class="comment-text">${comment.text}</div>
            </div>
            <div class="comment-footer">
              <div class="likes">
                <span class="likes-counter">${comment.likes}</span>
                <button data-index="${index}" class="like-button ${comment.isLiked ? "-active-like" : ""}"></button>
              </div>
            </div>
          </li>
          `;
        })
        .join("");

      commentsList.innerHTML = commentsHtml;
      initLikeButtons();
      initCommentReplies();
    };

    renderComments();

    // 2. Обработчик события на нажатие кнопки «Написать» (Шаг 3)
    addFormButton.addEventListener("click", function () {
      // Валидация: убираем пробелы и проверяем на пустоту
      const name = nameInput.value.trim();
      const text = textInput.value.trim();

      if (name === "" || text === "") {
        alert(
          "Нельзя добавить комментарий, не указав своего имени или текста комментария!",
        );
        return;
      }

      // === РАБОТА С ДАТОЙ (Объект Date) ===
      // Получаем текущую дату и время компьютера
      const currentDate = new Date();

      // Форматируем день, месяц, год, часы и минуты, чтобы всегда было две цифры (например, "02" вместо "2")
      const day = String(currentDate.getDate()).padStart(2, "0");
      const month = String(currentDate.getMonth() + 1).padStart(2, "0"); // Месяцы в JS идут с 0
      const year = String(currentDate.getFullYear()).slice(-2); // Берем последние 2 цифры года
      const hours = String(currentDate.getHours()).padStart(2, "0");
      const minutes = String(currentDate.getMinutes()).padStart(2, "0");

      // Собираем строку даты в нужном формате: "ДД.ММ.ГГ ЧЧ:ММ"
      const dateString = `${day}.${month}.${year} ${hours}:${minutes}`;

      // === БЕЗОПАСНОСТЬ (Экранирование текста пользователя) ===
      // Так как задание требует использовать напрямую innerHTML, мы должны вручную
      // обезвредить текст от XSS-атак, заменив опасные символы < и > на безопасные коды
      const safeName = name.replaceAll("<", "&lt;").replaceAll(">", "&gt;");
      const safeText = text.replaceAll("<", "&lt;").replaceAll(">", "&gt;");

      comments.push({
        name: safeName,
        date: dateString,
        text: safeText,
        likes: 0,
        isLiked: false,
      });

      renderComments();

      // 5. Очищаем поля ввода
      nameInput.value = "";
      textInput.value = "";
    });
  </script>
</html>
